name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Must match package.json, e.g. 2.30.0 (SDK 0.30.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CLI, SDK, and release versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run check:versions "$RELEASE_VERSION"

      - name: Validate CLI
        run: |
          bun run typecheck
          bun run test

      # One tarball per target. install.sh and `ellipsis update` pick the one for
      # the machine they run on, so the list here must match RELEASE_TARGETS in
      # src/lib/install.ts (test/install.test.ts checks).
      - name: Build platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            echo "::group::build $t"
            bun build src/cli.ts --compile --target=bun-"$t" --outfile ellipsis
            tar -czf "dist/ellipsis-$t.tar.gz" ellipsis
            rm -f ellipsis
            echo "::endgroup::"
          done

      # checksums.txt is what install.sh and `ellipsis update` verify against.
      - name: Compute checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
